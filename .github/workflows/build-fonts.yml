name: Build and Package Fonts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Font Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install font build dependencies
        run: pip install fontmake fonttools brotli ttfautohint-py

      # Release layout follows the other LOCAL FONTS projects (e.g. Terminalia):
      # autohinted/instance_ttf, instance_otf, variable_ttf and web.
      - name: Build autohinted TTF instances
        run: |
          fontmake -m src/VelekaWorld.designspace -i -a -o ttf \
            --output-dir dist/release/autohinted/instance_ttf/

      - name: Build OTF instances
        run: |
          fontmake -m src/VelekaWorld.designspace -i -o otf \
            --output-dir dist/release/instance_otf/

      - name: Build variable fonts
        run: |
          fontmake -m src/VelekaWorld.designspace -o variable \
            --output-dir dist/release/variable_ttf/
          fontmake -m src/VelekaWorld.designspace -o variable-cff2 \
            --output-dir dist/release/variable_cff2/

      - name: Build web fonts
        run: |
          mkdir -p dist/release/web
          cp dist/release/autohinted/instance_ttf/*.ttf dist/release/web/
          python - <<'EOF'
          import glob
          from fontTools.ttLib import TTFont
          for ttf_path in sorted(glob.glob('dist/release/web/*.ttf')):
              woff_path = ttf_path.replace('.ttf', '.woff')
              font = TTFont(ttf_path)
              font.flavor = 'woff'
              font.save(woff_path)
              print(f'Generated: {woff_path}')
          EOF
          for ttf in dist/release/web/*.ttf; do
            python -m fontTools.ttLib.woff2 compress "$ttf"
            echo "Generated: ${ttf%.ttf}.woff2"
          done
          # One variable WOFF2 covers every weight in the range, at a fraction
          # of the size of the four static ones.
          python -m fontTools.ttLib.woff2 compress \
            -o dist/release/web/VelekaWorld-VF.woff2 \
            dist/release/variable_ttf/VelekaWorld-VF.ttf

      # The packages built on OBS take the fonts and the license from this zip.
      - name: Add license
        run: cp documentation/OFL.txt dist/release/

      - name: List build artifacts
        run: find dist/release -type f | sort

      - name: Determine package version
        id: version
        run: |
          VERSION=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//' || echo "1.0.0")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload font artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fonts-${{ steps.version.outputs.version }}
          path: dist/release/

      # Distribution packages are built by the openSUSE Build Service from the
      # release zip below: https://build.opensuse.org/project/show/home:blago:localfonts
      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist/release && zip -r ../veleka-world-fonts-${{ steps.version.outputs.version }}.zip .

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veleka-world-fonts-${{ steps.version.outputs.version }}.zip
